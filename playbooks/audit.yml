---
# Fleet audit. Two plays, and each one is a role (see playbooks/roles/):
#   1. audit_host    runs on every host in the "fleet" group, in parallel (up to `forks` at a time).
#                    Each host ends up with one `audit_host_record` variable describing its health.
#   2. audit_report  runs once on the control node. It reads every host's record and writes the
#                    CSV, HTML and JSON reports.
# Thresholds and per-role expectations live in playbooks/group_vars/.

- name: Collect audit data from every host
  hosts: fleet
  gather_facts: false
  roles:
    - audit_host

- name: Build the fleet reports
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - audit_report
