---
# Audit policy for this fleet. These values override the defaults inside the roles
# (playbooks/roles/audit_host/defaults/main.yml and playbooks/roles/audit_report/defaults/main.yml).

# The role groups that make up the fleet. Keep the two lists equal.
audit_host_roles: [web, app, db]
audit_report_roles: [web, app, db]

# Thresholds. A host breaching a "crit" threshold is CRIT, a "warn" breach is WARN.
audit_host_disk_warn_pct: 80          # any audited filesystem this full or fuller
audit_host_disk_crit_pct: 90
audit_host_mem_avail_warn_pct: 15     # available memory below this share of total
audit_host_load_per_cpu_warn: 3.0     # 1-minute load average divided by CPU count (use ~1.0 on real servers;
                                      # the simulated containers share one kernel, so they all report the host's load)

# Set true (or pass -e audit_report_fail_on_critical=true) to make the run exit non-zero when any host is
# CRIT, UNREACHABLE or ERROR. Useful when the audit runs from a scheduler.
audit_report_fail_on_critical: false

# Disk-full estimate. Hosts are ranked by how soon a disk is expected to fill, using the earlier reports.
audit_report_trend_window_hours: 24      # use reports from the last 24 hours
audit_report_trend_min_samples: 3        # need at least 3 reports ...
audit_report_trend_min_span_minutes: 30  # ... that together cover at least 30 minutes
