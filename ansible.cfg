[defaults]
inventory = inventory/docker_inventory.py
remote_user = ops
private_key_file = fleet/ssh/id_fleet
# forks = how many hosts Ansible works on in parallel. Default is 5; 50 hosts at 5 forks means 10 rounds.
forks = 25
# Give up on a host that does not answer within 10 seconds, so one dead host cannot stall the run.
timeout = 10
retry_files_enabled = False
interpreter_python = auto_silent
# SIMULATION ONLY. Containers get new host keys every time the fleet is rebuilt.
# Against real servers, keep host key checking ON.
host_key_checking = False

[ssh_connection]
# Pipelining sends module code over the existing SSH channel: fewer round trips per task.
pipelining = True
# Reuse one SSH connection per host instead of reconnecting for every task.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
